<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Deer AI</title>
  <style>
    body    { margin: 0; font-family: monospace; background-color: black; position: relative; display: inline-block; width: 99vw; color: #fff;}
    #videoWrapper { position: relative; display: inline-block; height: 99.5vh; }
    #video { height: 100%; display: block; }
    #bars   { position: absolute; bottom: 60px; left: 12px; right: 12px; height: 50px; transition: 0.3s ease}
    #bars:hover { transform: translate(0%, -100%) scaleY(3);}
    .bar    { position: absolute; cursor: pointer; bottom: 0; }
    .bar               { background: rgba(255, 255, 255, 0.25);}
    .bar.peak          { background: white; }
    .bar.current       { background: #00ff44; transform: translate(-250%, 0%) scaleX(3);}
    .bar:hover         { background: #39ff14 !important; transform: translate(-250%, 0%) scaleX(3);}
    #progressBar { position: absolute; bottom: 52px; left: 12px; right: 12px; height: 3px; background: rgba(255,255,255,0.15); cursor: pointer; }
    #progressFill { position: absolute; left: 0; top: 0; height: 100%; background: #00bb33; pointer-events: none; }
    #progressHandle { position: absolute; top: 50%; width: 10px; height: 10px; background: #00ff44; border-radius: 50%; transform: translate(-50%, -50%); pointer-events: none; transition: transform 0.1s; }
    #progressBar:hover #progressHandle { transform: translate(-50%, -50%) scale(1.4); }
    #panel { position: fixed; top: 0; right: 0; height: 80vh; background: rgba(0,0,0,0.5); transition: transform 0.3s ease; display: flex; border-radius: 0 0 0 4px}
    #panel.hidden { transform: translateX(432px) }
    #tableDiv { width: 400px; padding: 16px }
    #toggle { display: flex; align-items: center; cursor: pointer; padding: 16px 16px; font-size: 24px; transition: right 0.3s ease, color 0.2s; }
    #toggle:hover { background: rgba(255,255,255,0.1) }
    
    table { border-collapse: collapse; }
    tr { display: table; width: 100%; table-layout: fixed; }
    thead, tfoot { display: table; width: 100%; table-layout: fixed; }
    tbody { display: block; max-height: 53vh; overflow-y: auto; width: 100%; overflow-x: hidden }
    tbody::-webkit-scrollbar { width: 4px; }
    tbody::-webkit-scrollbar-track { background: transparent; }
    tbody::-webkit-scrollbar-thumb { background: rgba(255,255,255,0.2); border-radius: 2px; }
    tbody::-webkit-scrollbar-thumb:hover { background: rgba(255,255,255,0.4); }
    th { font-size: 12px; font-weight: 500; letter-spacing: 0.08em; color: rgba(255,255,255,0.5); text-align: left; padding: 0 8px 6px; border-bottom: 0.5px solid rgba(255,255,255,0.1); }
    td { font-size: 16px; padding: 7px 8px; border-bottom: 0.5px solid rgba(255,255,255,0.06); color: rgba(255,255,255,0.85); }
    tr { display: table; width: 100%; table-layout: fixed; cursor: pointer; transition: background 0.12s; }
    tr:hover td { background: rgba(57,255,20,0.3); color: #39ff14; }
    tr.selected td { background: rgba(0,255,68,0.2); color: #00ff44; }
    .dot { width: 7px; height: 7px; border-radius: 50%; background: rgba(255,255,255,0.3); flex-shrink: 0; display: inline-block; margin-right: 6px; vertical-align: middle; }
    tr.selected .dot { background: #00ff44; }
    tr:hover .dot { background: #39ff14; }
    .count-bar-wrap { display: flex; align-items: center; gap: 6px; }
    .count-bar { height: 3px; background: rgba(255,255,255,0.15); border-radius: 2px; }
    tr.selected .count-bar { background: rgba(0,255,68,0.7); }
    tr:hover .count-bar { background: rgba(57,255,20,0.7); }
    tfoot tr td { padding-top: 10px; border-top:0.5px solid rgba(255,255,255,0.15)}
    .correction-input { background: transparent; border: none; border-bottom: 0.5px solid rgba(255,255,255,0.2); color: #fff; font-size: 16px; outline: none; width: 48px; font-family: monospace; }
    .correction-input:focus { border-bottom-color: #00ff44; }
    .correction-input::placeholder { color: rgba(255,255,255,0.2); }
  </style>
</head>
<body>
  <div id="videoWrapper">
    <video id="video"></video>
    <div id="bars"></div>
    <div id="progressBar">
      <div id="progressFill"></div>
      <div id="progressHandle"></div>
    </div>
  </div>
  <div id="panel">
    <div id="toggle" onclick="togglePanel()">></div>
    <div id="tableDiv">
      <h2>Detection Peaks</h2>
      <table id="peaksTable">
        <thead><tr><th>TIMESTAMP</th><th>DETECTIONS</th><th>CORRECTED</th></tr></thead>
        <tbody id="peaksTableBody"></tbody>
        <tfoot>
          <tr>
            <td style="color:rgba(255,255,255,0.35); font-size:11px; letter-spacing:0.08em;">TOTAL</td>
            <td><<ESTIMATE>></td>
            <td id="correctedTotal" style="color:rgba(255,255,255,0.4);">—</td>
          </tr>
        </tfoot>
      </table>
      <br><br>
      <div style=" line-height:1.8; display:grid; grid-template-columns:1fr 1fr; gap:0 8px;">
          <div>↑ ↓&nbsp;&nbsp; prev / next peak</div>
          <div>space &nbsp;▶ / ⏸</div>
          <div>← →&nbsp;&nbsp; ±0.1s</div>
          <div>h &nbsp;&nbsp;&nbsp; hide panel</div>
      </div>
    </div>
  </div>
  
  <script>
    const filename = window.location.pathname.split('/').pop().replace('.html', '');
    document.title = filename
    const video = document.getElementById('video');
    video.src = filename + '.mp4';
    const bars  = document.getElementById('bars');
    const peaksTableBody = document.getElementById('peaksTableBody')
    const fps   = 10;
    const counts = <<COUNTS>>
    const peaks = <<PEAKS>>
    const countsBySecond = [];
    const seconds = Math.round(counts.length / fps);

    for (let s = 0; s < seconds; s++) {
      const firstFrame = s * fps
      const lastFrame = (s + 1) * fps
      const slice = counts.slice(firstFrame, lastFrame);
      const maxValue = Math.max(...slice)
      const maxFrame = slice.indexOf(maxValue) + (s * fps); 
      const isPeak = peaks.some(peak => (firstFrame <= peak) && (peak < lastFrame));
      countsBySecond.push({ count: maxValue, timeMs: (maxFrame / fps) * 1000, isPeak: isPeak });
    }
    const maxCount = Math.max(...countsBySecond.map(d => d.count));
    const barElements = [];
    const trElements = [];
    countsBySecond.forEach((d, s) => {
      if (d.count === 0) return;
      const bar = document.createElement('div');
      bar.className = 'bar';
      bar.style.left = (s / countsBySecond.length * 100) + '%';
      bar.style.width = (1 / countsBySecond.length * 100) + '%';
      bar.style.height = Math.round((Math.log1p(d.count) / Math.log1p(maxCount)) * 100) + '%';
      if (d.isPeak) bar.classList.add('peak')
      bar.addEventListener('click', () => seekTo(d.timeMs));
      barElements[s] = bar;
      bars.appendChild(bar);

      if (d.isPeak) {
        const maxCount = Math.max(...countsBySecond.filter(x => x.isPeak).map(x => x.count));
        const barW = Math.round((d.count / maxCount) * 40);
        const tr = document.createElement('tr');
        tr.innerHTML = `
            <td><span class="dot"></span>${fmt(Math.round(d.timeMs / 1000))}</td>
            <td><span class="count-bar-wrap"><span>${d.count}</span><span class="count-bar" style="width:${barW}px"></span></span></td>
            <td><input class="correction-input" type="number" min="0" placeholder="—" /></td>
        `;
        tr.addEventListener('click', () => seekTo(d.timeMs));
        peaksTableBody.appendChild(tr);
        trElements[s] = tr
      }
    });

    function seekTo(timeMs) {
      const timeSec = timeMs / 1000;
      if (Math.abs(video.currentTime - timeSec) > 0.1) video.currentTime = timeSec;
    }
    function fmt(s) { return Math.floor(s / 60) + ':' + String(s % 60).padStart(2, '0'); }
    function togglePanel() {
      const panel = document.getElementById('panel');
      const tab = document.getElementById('toggle');
      const hidden = panel.classList.toggle('hidden');
      tab.textContent = hidden ? '<' : '>';
    }

    video.addEventListener('timeupdate', () => {
      const pct = video.currentTime / video.duration * 100;
      document.getElementById('progressFill').style.width = pct + '%';
      document.getElementById('progressHandle').style.left = pct + '%';
      const currentSecond = Math.floor(video.currentTime);
      countsBySecond.forEach((d, s) => {
        const bar = barElements[s];
        if (!bar) return;
        const isCurrentSecond = s === currentSecond;
        bar.classList.toggle('current', s === currentSecond);
        if (d.isPeak && trElements[s]) {
            const isSelected = s === currentSecond;
            trElements[s].classList.toggle('selected', isSelected);
            if (isSelected) {
              trElements[s].scrollIntoView({ block: 'nearest', behavior: 'smooth' });
            }
          }
        });
    });

    const progressBar = document.getElementById('progressBar');
    progressBar.addEventListener('click', (e) => {
        const rect = progressBar.getBoundingClientRect();
        const pct = (e.clientX - rect.left) / rect.width;
        video.currentTime = pct * video.duration;
    });

    progressBar.addEventListener('mousemove', (e) => {
        if (e.buttons !== 1) return;
        const rect = progressBar.getBoundingClientRect();
        const pct = Math.max(0, Math.min(1, (e.clientX - rect.left) / rect.width));
        video.currentTime = pct * video.duration;
    });

    document.getElementById('peaksTable').addEventListener('input', () => {
      const inputs = document.querySelectorAll('.correction-input');
      let total = 0;
      let anyFilled = false;
      inputs.forEach(input => {
          if (input.value !== '') {
              total += parseInt(input.value) || 0;
              anyFilled = true;
          }
      });
      const el = document.getElementById('correctedTotal');
      el.textContent = anyFilled ? total : '—';
      el.style.color = anyFilled ? '#00ff44' : 'rgba(255,255,255,0.4)';
    });

    document.addEventListener('keydown', (e) => {
      if (e.target.classList.contains('correction-input')) return;
      switch(e.key) {
        case ' ':
          e.preventDefault();
          video.paused ? video.play() : video.pause();
            break;
          case 'ArrowRight':
            video.currentTime += 0.1;
            break;
          case 'ArrowLeft':
            video.currentTime -= 0.1;
            break;
          case 'ArrowDown':
            e.preventDefault();
            const nextPeak = countsBySecond.find((d, s) => d.isPeak && s > Math.floor(video.currentTime));
            if (nextPeak) seekTo(nextPeak.timeMs);
            break;
          case 'ArrowUp':
            e.preventDefault();
            let prevPeak = null;
            for (let i = Math.floor(video.currentTime) - 1; i >= 0; i--) {
              if (countsBySecond[i]?.isPeak) { prevPeak = countsBySecond[i]; break; }
            }
            if (prevPeak) seekTo(prevPeak.timeMs);
            break;
          case 'h':
            togglePanel();
            break;   
      }
    });
    seekTo(0);
  </script>
</body>
</html>
